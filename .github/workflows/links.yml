name: links

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - README.md
      - .github/workflows/links.yml
  pull_request:
    paths:
      - site/**
      - README.md
      - .github/workflows/links.yml
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: umbrelladocs/action-linkspector@v1
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter
          fail_level: any
