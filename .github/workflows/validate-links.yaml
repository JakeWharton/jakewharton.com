name: validate-links

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm --volume="$PWD/site:/blog" $(docker build -q .) --validate-links /blog
